<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모던 공학용 계산기 - 꼬리잡기 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            touch-action: manipulation; /* 모바일 더블탭 줌 방지 */
        }
    </style>
</head>
<body class="bg-gray-950 min-h-screen flex flex-col text-gray-100">

    <!-- 상단 네비게이션 메뉴 -->
    <nav class="w-full bg-gray-900 p-4 flex justify-center gap-8 border-b border-gray-800 shadow-md flex-shrink-0">
        <a href="index.html" class="text-gray-400 hover:text-white transition-colors pb-1 text-lg">1번 탭 (계산기)</a>
        <!-- 2번 페이지(page2.html) 하이라이트 -->
        <a href="page2.html" class="text-teal-400 font-bold border-b-2 border-teal-400 pb-1 text-lg">2번 탭 (게임)</a>
    </nav>

    <!-- 게임 메인 영역 -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <!-- 게임 헤더 -->
        <div class="w-full max-w-sm flex justify-between items-end mb-4 px-2">
            <h1 class="text-2xl font-bold text-white">꼬리잡기</h1>
            <div class="text-xl font-semibold text-teal-400">점수: <span id="score">0</span></div>
        </div>

        <!-- 게임 캔버스 컨테이너 -->
        <div class="bg-gray-800 p-2 rounded-2xl shadow-2xl border border-gray-700 relative">
            <canvas id="gameCanvas" width="400" height="400" class="bg-black rounded-xl w-full max-w-[360px] sm:max-w-[400px] aspect-square block"></canvas>
            
            <!-- 게임 오버 오버레이 (초기엔 숨김) -->
            <div id="gameOverScreen" class="absolute inset-0 bg-black/70 rounded-2xl hidden flex-col items-center justify-center">
                <p class="text-3xl font-bold text-white mb-2">게임 오버!</p>
                <p class="text-gray-300 mb-6">최종 점수: <span id="finalScore" class="text-teal-400 font-bold">0</span></p>
                <button onclick="resetGame()" class="bg-teal-500 hover:bg-teal-400 text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-lg">
                    다시 시작
                </button>
            </div>
        </div>

        <!-- 모바일 조작 버튼 (D-Pad) -->
        <div class="mt-8 grid grid-cols-3 gap-2 w-48 sm:w-56 mb-4">
            <div></div>
            <button onclick="changeDirection(0, -1)" class="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-teal-400 rounded-xl h-14 flex items-center justify-center text-2xl transition-colors">▲</button>
            <div></div>
            
            <button onclick="changeDirection(-1, 0)" class="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-teal-400 rounded-xl h-14 flex items-center justify-center text-2xl transition-colors">◀</button>
            <button onclick="changeDirection(0, 1)" class="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-teal-400 rounded-xl h-14 flex items-center justify-center text-2xl transition-colors">▼</button>
            <button onclick="changeDirection(1, 0)" class="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-teal-400 rounded-xl h-14 flex items-center justify-center text-2xl transition-colors">▶</button>
        </div>
        
        <p class="text-gray-500 text-sm mt-2 text-center">
            데스크톱: 방향키 조작<br>
            모바일: 버튼 터치 또는 화면 스와이프
        </p>

    </main>

    <!-- 게임 스크립트 -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');

        // 게임 설정 변수
        const gridSize = 20; // 그리드 크기
        const tileCount = canvas.width / gridSize; // 20x20 타일
        const speed = 120; // 뱀 이동 속도 (ms)

        let snake = [{x: 10, y: 10}]; // 뱀 초기 위치 (가운데)
        let food = {x: 5, y: 5};      // 먹이 초기 위치
        let dx = 0;                   // x축 이동 방향
        let dy = 0;                   // y축 이동 방향
        let score = 0;
        let isGameOver = false;
        let gameLoopTimeout;
        let directionChanged = false; // 한 틱에 여러 번 방향 바꾸기 방지

        // 게임 시작
        function startGame() {
            spawnFood();
            gameLoop();
        }

        // 메인 게임 루프
        function gameLoop() {
            if (isGameOver) return;

            directionChanged = false;
            moveSnake();
            
            if (checkCollision()) {
                handleGameOver();
                return;
            }
            
            checkFoodCollision();
            
            clearScreen();
            drawFood();
            drawSnake();

            gameLoopTimeout = setTimeout(gameLoop, speed);
        }

        // 화면 지우기
        function clearScreen() {
            ctx.fillStyle = '#000000'; // 배경 검정
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 뱀 그리기
        function drawSnake() {
            snake.forEach((part, index) => {
                // 머리는 조금 더 밝은 색, 몸통은 기본 색
                ctx.fillStyle = index === 0 ? '#2dd4bf' : '#0f766e'; // 머리: teal-400, 몸통: teal-700
                // 약간의 여백을 주어 블록 느낌을 살림
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
        }

        // 먹이(사과) 그리기
        function drawFood() {
            ctx.fillStyle = '#ef4444'; // red-500
            ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);
        }

        // 뱀 이동 로직
        function moveSnake() {
            // 정지 상태면 이동하지 않음
            if (dx === 0 && dy === 0) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head); // 새로운 머리 추가
            snake.pop();         // 꼬리 자르기 (먹이를 안먹었을 때)
        }

        // 방향 전환 로직 (버튼 및 키보드용)
        function changeDirection(newDx, newDy) {
            // 게임 오버 상태일 때 아무 키나 누르면 재시작하지 않고 무시
            if (isGameOver) return;
            
            // 한 틱 내에 여러번 입력 방지
            if (directionChanged) return; 

            // 반대 방향으로 이동 방지 (자신의 몸통을 뚫고 가는 것 방지)
            if (dx === -newDx && dx !== 0) return;
            if (dy === -newDy && dy !== 0) return;

            // 게임이 아직 안 시작한 상태(정지)에서 방향키를 누르면 이동을 시작하도록
            // 단, 처음엔 뱀이 1칸짜리이므로 어디로든 이동 가능
            dx = newDx;
            dy = newDy;
            directionChanged = true;
        }

        // 충돌 검사
        function checkCollision() {
            const head = snake[0];
            
            // 1. 벽 충돌 검사
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            
            // 2. 자기 몸 충돌 검사
            // 움직이고 있을 때만 검사
            if (dx !== 0 || dy !== 0) {
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        return true;
                    }
                }
            }
            
            return false;
        }

        // 먹이 충돌 검사
        function checkFoodCollision() {
            if (snake[0].x === food.x && snake[0].y === food.y) {
                // 점수 증가
                score += 10;
                scoreElement.innerText = score;
                
                // 꼬리 길이 늘리기 (방금 pop된 꼬리 위치 복구 느낌으로 끝에 하나 추가)
                snake.push({...snake[snake.length - 1]}); 
                
                // 새로운 먹이 소환
                spawnFood();
            }
        }

        // 새로운 먹이 무작위 위치 생성
        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            // 뱀의 몸통 위에 먹이가 생성되었는지 확인
            let onSnake = snake.some(part => part.x === food.x && part.y === food.y);
            
            // 만약 뱀 위에 생성되었다면 다시 생성
            if (onSnake) {
                spawnFood();
            }
        }

        // 게임 오버 처리
        function handleGameOver() {
            isGameOver = true;
            clearTimeout(gameLoopTimeout);
            finalScoreElement.innerText = score;
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');
        }

        // 게임 리셋 (다시 시작)
        function resetGame() {
            // 변수 초기화
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            isGameOver = false;
            directionChanged = false;
            
            // UI 업데이트
            scoreElement.innerText = score;
            gameOverScreen.classList.add('hidden');
            gameOverScreen.classList.remove('flex');
            
            startGame();
        }

        // 키보드 방향키 조작 이벤트 설정
        document.addEventListener('keydown', (event) => {
            // 방향키 기본 동작(스크롤) 방지 (캔버스 화면 내에서만)
            if(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
                event.preventDefault();
            }

            switch(event.key) {
                case 'ArrowUp':    changeDirection(0, -1); break;
                case 'ArrowDown':  changeDirection(0, 1); break;
                case 'ArrowLeft':  changeDirection(-1, 0); break;
                case 'ArrowRight': changeDirection(1, 0); break;
            }
        });

        // 모바일 스와이프 조작 이벤트 설정
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        // 캔버스 위에서 스와이프할 때 화면 스크롤 방지
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
        });

        function handleSwipe(startX, startY, endX, endY) {
            const dxSwipe = endX - startX;
            const dySwipe = endY - startY;
            const absDx = Math.abs(dxSwipe);
            const absDy = Math.abs(dySwipe);

            // 움직인 거리가 너무 짧으면 무시 (오터치 방지)
            if (Math.max(absDx, absDy) < 20) return;

            if (absDx > absDy) {
                // 수평 이동 (X축)
                if (dxSwipe > 0) changeDirection(1, 0);       // Right
                else changeDirection(-1, 0);                  // Left
            } else {
                // 수직 이동 (Y축)
                if (dySwipe > 0) changeDirection(0, 1);       // Down
                else changeDirection(0, -1);                  // Up
            }
        }

        // 페이지 로드 시 최초 1회 게임 초기화
        window.onload = () => {
            startGame();
            // 최초에 화면은 그려두되(drawSnake) 움직이진 않음 (dx=0, dy=0)
        };

    </script>
</body>
</html>
